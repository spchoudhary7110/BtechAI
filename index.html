<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Reading List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📚 My Reading List</h1>

        <!-- Add Book Form -->
        <div class="form-card">
            <input type="text" id="bookTitle" placeholder="Enter book title">

            <select id="bookStatus">
                <option value="To Read">To Read</option>
                <option value="Reading">Reading</option>
                <option value="Done">Done</option>
            </select>

            <button id="addBookBtn">Add Book</button>
        </div>

        <!-- Counts -->
        <div class="counts">
            <span>To Read: <strong id="toReadCount">0</strong></span>
            <span>Reading: <strong id="readingCount">0</strong></span>
            <span>Done: <strong id="doneCount">0</strong></span>
        </div>

        <!-- Filter -->
        <div class="filter-section">
            <label for="filterStatus">Filter:</label>
            <select id="filterStatus">
                <option value="All">All</option>
                <option value="To Read">To Read</option>
                <option value="Reading">Reading</option>
                <option value="Done">Done</option>
            </select>
        </div>

        <div class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="Search books by title..."
            >
        </div>
        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            No books yet. Add your first book.
        </div>

        <!-- Book List -->
        <div id="bookList" class="book-grid"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
